<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GbEmu</title>
    <link data-trunk rel="scss" href="src/index.scss"/>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="gbemu-wasm"/>
</head>
<body>
<div class="container">
    <canvas id="screen" width="160" height="144"></canvas>
    <div class="controls">
        <input type="file" id="rom-input" accept=".gb,.zip">
    </div>
    <div class="buttons-row">
        <button id="toggle-run-btn">▶ Run</button>
        <button id="reset-btn">↺ Reset</button>
    </div>
</div>
<script data-trunk type="module" src="src/main.js"></script>
</body>
</html>
