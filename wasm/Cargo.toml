[package]
name = "gbemu-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gbemu-core = { path = "../core" }

console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
] }
